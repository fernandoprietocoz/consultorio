<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administrador psicoanalítico</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FF7A3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"DM Sans";font-style:normal;font-weight:300 700;font-display:swap;src:url(dmsans.woff2) format("woff2")}
:root{
  --g1:#FF7A3D;--g2:#FF6FB5;--grad:linear-gradient(90deg,#FF7A3D 0%,#FF6FB5 100%);
  --bg:#F7F6F9;--card:#fff;--ink:#1F1D2B;--ink2:#4B4859;--mut:#8C8999;--line:#ECEAF1;
  --pres:#FF7A3D;--presSoft:#FFF1E9;--vir:#E2559F;--virSoft:#FFEAF4;
  --ok:#1F9D6B;--okSoft:#E6F6EF;--bad:#E5484D;--badSoft:#FDECEC;--warnSoft:#FFF4E5;
  --r:18px;--sh:0 1px 2px rgba(31,29,43,.04),0 6px 20px rgba(31,29,43,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{padding:0 18px}
.stack>*+*{margin-top:12px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(247,246,249,.92);backdrop-filter:blur(10px);padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:21px;font-weight:700;flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}

/* Buttons */
.btn{border:0;border-radius:14px;height:50px;padding:0 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;font-size:15px}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,111,130,.28)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--presSoft);color:#C4561F}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.sm{height:38px;border-radius:11px;font-size:14px;padding:0 12px;width:auto}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:#E0598A;font-weight:600;cursor:pointer;padding:0}

/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card.tap{cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.pres{background:var(--presSoft);color:#C4561F}
.chip.vir{background:var(--virSoft);color:#B8377A}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.bad{background:var(--badSoft);color:var(--bad)}
.chip.gray{background:#F0EFF4;color:var(--ink2)}
.chip.warn{background:var(--warnSoft);color:#B86A00}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.pres{background:var(--pres)}.dot.vir{background:var(--vir)}

/* Illustration placeholder */
.illo{border:2px dashed #F3C2D3;border-radius:16px;background:repeating-linear-gradient(135deg,#FFF7F2 0 10px,#FFF0F6 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px;color:#C0577F;font-size:12.5px;gap:3px}
.illo b{font-size:10.5px;letter-spacing:.12em;color:#E0598A}

/* Welcome */
.welcome{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;background:#2A2433 center/cover no-repeat;color:#fff;padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom)}
.welcome.nophoto{background:linear-gradient(160deg,#FF8A50 0%,#FF6FB5 100%)}
.welcome::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,30,.45) 0%,rgba(20,15,30,0) 38%,rgba(20,15,30,0) 62%,rgba(20,15,30,.45) 100%)}
.welcome.nophoto::before{background:none}
.welcome>*{position:relative}
.w-top{display:flex;flex-direction:column;align-items:center;margin-top:max(10vh,40px)}
.w-top .mark{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin-bottom:22px}
.w-top .mark svg{width:46px;height:46px}
.w-top .mark.grad{background:var(--grad);color:#fff;border:2px solid rgba(255,255,255,.75);box-shadow:0 10px 26px rgba(20,15,30,.22)}
.w-top .mark.white{background:#fff;color:#E2559F;box-shadow:0 10px 26px rgba(20,15,30,.15)}
.w-top h1{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:.035em;max-width:310px;text-shadow:0 1px 12px rgba(20,15,30,.18)}
.w-bot{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));font-size:13px;opacity:.85;animation:pl 1.8s infinite;letter-spacing:.04em}
.w-btn{width:78px;height:78px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.14);backdrop-filter:blur(6px);display:grid;place-items:center;animation:pl 2.4s infinite}
.w-btn svg{width:36px;height:36px}
.w-bot span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;opacity:.9}
@keyframes pl{50%{opacity:.35}}

/* Menu */
.hello{padding:22px 18px 6px}
.hello h2{font-size:26px;font-weight:700}
.menu-item{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px 16px}
.num{width:52px;height:52px;border-radius:16px;background:var(--grad);color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;flex:none}
.menu-item h3{font-size:18px}
.today-list{margin-top:10px}
.today-list .r{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.banner{border-radius:16px;padding:12px 14px;background:var(--warnSoft);color:#8A5000;font-size:14px;display:flex;gap:10px;align-items:flex-start}

/* Segmented */
.seg{display:flex;background:#EEEDF2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Calendar */
.calbar{display:flex;align-items:center;gap:8px;padding:0 18px 10px}
.calbar .lbl{flex:1;font-weight:700;font-size:16px;text-transform:capitalize}
.week{margin:0 8px;background:#fff;border-radius:var(--r);box-shadow:var(--sh)}
.wk-head{display:grid;grid-template-columns:36px repeat(7,1fr);border-bottom:1px solid var(--line);position:sticky;top:66px;background:#fff;z-index:5;border-radius:var(--r) var(--r) 0 0}
.wk-head div{text-align:center;padding:6px 0 4px;font-size:11px;color:var(--mut);cursor:pointer}
.wk-head div b{display:block;font-size:15px;color:var(--ink);margin-top:2px;width:28px;height:28px;line-height:28px;border-radius:50%;margin:2px auto 0}
.wk-head div.today b{background:var(--grad);color:#fff}
.wk-body{display:grid;grid-template-columns:36px repeat(7,1fr);position:relative}
.tcol div{font-size:9px;white-space:nowrap;color:var(--mut);text-align:right;padding-right:4px;transform:translateY(-6px)}
.dcol{position:relative;border-left:1px solid var(--line);cursor:pointer}
.blk{position:absolute;left:2px;right:2px;border-radius:7px;padding:2px 4px;font-size:10px;line-height:1.15;overflow:hidden;cursor:pointer;border-left:3px solid}
.blk b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.presencial{background:var(--presSoft);border-color:var(--pres);color:#8A3A12}
.blk.virtual{background:var(--virSoft);border-color:var(--vir);color:#8C2460}
.blk.st-cancelo,.blk.st-cancelo_tarde{background:#F3F2F6;border-color:#C9C6D2;color:#8C8999}
.blk.st-cancelo b,.blk.st-cancelo_tarde b{text-decoration:line-through}
.blk.st-no_asistio{background:var(--badSoft);border-color:var(--bad);color:#9B2226}
.day-list .slot{display:flex;gap:12px;align-items:stretch;min-height:50px}
.day-list .h{width:48px;font-size:13px;color:var(--mut);padding-top:10px;text-align:right;flex:none}
.day-list .free{flex:1;border:1px dashed var(--line);border-radius:14px;margin:4px 0;color:#C2BFCC;font-size:13px;display:flex;align-items:center;padding:0 14px;cursor:pointer}
.scard{flex:1;margin:4px 0;border-radius:14px;padding:10px 14px;cursor:pointer;border-left:4px solid}
.scard.presencial{background:var(--presSoft);border-color:var(--pres)}
.scard.virtual{background:var(--virSoft);border-color:var(--vir)}
.scard.st-cancelo,.scard.st-cancelo_tarde{background:#F3F2F6;border-color:#C9C6D2}
.scard.st-no_asistio{background:var(--badSoft);border-color:var(--bad)}
.scard .nm{font-weight:700;font-size:15px}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;border:0;box-shadow:0 8px 22px rgba(255,111,130,.4);display:grid;place-items:center;cursor:pointer;z-index:30}
.fab svg{width:26px;height:26px}

/* Lists */
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:14px;width:18px;height:18px;color:var(--mut)}
.pitem{display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:15px}
.avatar.v{background:linear-gradient(135deg,#FF8DC4,#E2559F)}
.pitem .nm{font-weight:700}
.amount{font-weight:700;font-size:16px;white-space:nowrap}
.amount.due{color:var(--bad)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;padding:0 18px 12px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;height:38px;padding:0 16px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--grad);border-color:transparent;color:#fff}
.sec-title{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}

/* Forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.in{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;outline:none;font-size:15px}
textarea.in{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(255,122,61,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slotrow{display:grid;grid-template-columns:1fr 112px 48px;gap:8px;margin-bottom:8px}
.tp{display:grid;grid-template-columns:1fr 132px;gap:8px;align-items:center}.tp .seg button{height:40px}
.ico{width:54px;height:54px;border-radius:50%;background:var(--grad);box-shadow:0 6px 14px rgba(255,111,130,.28);display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:28px;height:28px}
.menu-item h3{font-size:19px;font-weight:700}
.menu-btn{display:flex;align-items:center;gap:14px;cursor:pointer;border-radius:20px;padding:20px 20px;background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(255,111,130,.30)}
.menu-btn h3{font-size:22px;font-weight:700}
.menu-btn .sub{font-size:14px;opacity:.92;margin-top:2px}
.menu-btn svg{color:#fff}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;cursor:pointer;border:1px solid var(--line)}
.counter{font-size:12px;text-align:right;margin-top:4px;color:var(--mut)}
.counter.over{color:var(--bad);font-weight:700}

/* Sheet & dialog */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(25,20,35,.42);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
.sheet-wrap.on .sheet{transform:none}.sheet-wrap.on .sheet-bg{opacity:1}
.grab{width:42px;height:5px;border-radius:5px;background:#D8D5DF;margin:4px auto 14px}
.sheet h2{font-size:21px;font-weight:700}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actbtn{border:1px solid var(--line);background:#fff;border-radius:16px;height:74px;font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.actbtn small{font-weight:500;color:var(--mut);font-size:11.5px}
.actbtn.sel{border:2px solid var(--g1);background:var(--presSoft)}
.alert{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.alert.bad{background:var(--badSoft);color:#9B2226}
.alert.ok{background:var(--okSoft);color:#155C40}
.alert.warn{background:var(--warnSoft);color:#8A5000}
.alert.info{background:#F0EFF4;color:var(--ink2)}
.dlg-wrap{position:fixed;inset:0;z-index:80;background:rgba(25,20,35,.45);display:grid;place-items:center;padding:24px}
.dlg{background:#fff;border-radius:22px;padding:22px;max-width:380px;width:100%}
.dlg h3{font-size:18px;margin-bottom:8px}
.dlg p{margin:0 0 16px;color:var(--ink2)}
.dlg-btns{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1F1D2B;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:90;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.loading{padding:60px 20px;text-align:center;color:var(--mut)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--g1)}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;background:linear-gradient(160deg,#FF8A50 0%,#FF6FB5 100%);padding:env(safe-area-inset-top) 20px calc(30px + env(safe-area-inset-bottom))}
.lock-card{background:#fff;color:var(--ink);border-radius:22px;padding:20px;width:100%;max-width:400px;text-align:left;margin-top:26px;box-shadow:0 12px 30px rgba(20,15,30,.18)}
.pitem{flex-wrap:wrap}.pchips{display:flex;gap:8px;flex-basis:100%;padding-left:56px;margin-top:-2px}
.pchips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;height:32px;padding:0 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.pchips button.cl{background:var(--virSoft);border-color:transparent;color:#B8377A}
.mico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--presSoft);color:#C4561F}
.mico.audio{background:var(--virSoft);color:#B8377A}.mico.nota{background:#F0EFF4;color:var(--ink2)}
.actbtn svg{margin-bottom:2px}
.doctext{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55;max-height:55vh;overflow:auto}
.recdot{width:16px;height:16px;border-radius:50%;background:var(--bad);animation:pl 1.2s infinite}
.pbar{height:8px;border-radius:8px;background:#EEEDF2;overflow:hidden;margin:10px 0 6px}.pbar div{height:100%;width:0;background:var(--grad);transition:width .2s}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>

<script src="vault.js"></script>
<script>
"use strict";
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>{const x=parseD(s).getDay();return x===0?7:x};
const today=()=>ymd(new Date());
const toMin=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmtH=h=>{if(!h)return'';const[H,M]=h.split(':').map(Number);return `${H%12||12}:${pad(M)} ${H<12?'am':'pm'}`};
const fmtHc=h=>{const[H,M]=h.split(':').map(Number);return `${H%12||12}${M?':'+pad(M):''} ${H<12?'am':'pm'}`};
const fmtHh=H=>`${H%12||12} ${H<12||H===24?'am':'pm'}`;
function tp(attr,val){return `<input class="in" type="time" step="300" ${attr} value="${esc(val||'09:00')}">`}
function tpVal(w){return w.value||''}
const dt=(f,h)=>{const d=parseD(f);const[a,b]=h.split(':').map(Number);d.setHours(a,b,0,0);return d};
const mondayOf=s=>addD(s,1-dow(s));
const DIAS=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const D3=['','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtLong=f=>{const d=parseD(f);return `${DIAS[dow(f)]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const fmtShort=f=>{const d=parseD(f);return `${D3[dow(f)]} ${d.getDate()}/${pad(d.getMonth()+1)}`};
const mesKey=f=>f.slice(0,7);
const mesLabel=mk=>{const[y,m]=mk.split('-').map(Number);return `${MESES[m-1]} ${y}`};
const lastDay=mk=>{const[y,m]=mk.split('-').map(Number);return ymd(new Date(y,m,0))};
const shiftMes=(mk,n)=>{const[y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return ymd(d).slice(0,7)};
const money=n=>'S/ '+(Math.round((n||0)*100)/100).toLocaleString('es-PE',{maximumFractionDigits:2});
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const first=n=>(n||'').trim().split(/\s+/)[0];
const clone=o=>JSON.parse(JSON.stringify(o??null));
const ICON={

/* ============ Modelo de sesiones ============ */
function scheduleAt(p,d){let r=null;for(const h of (p.horarios||[]))if(h.desde<=d&&(!r||h.desde>=r.desde))r=h;return r}
const enPausa=(p,d)=>(p.pausas||[]).some(x=>x.desde<=d&&(!x.hasta||d<=x.hasta));
const pausaActual=(p,d=today())=>(p.pausas||[]).find(x=>x.desde<=d&&(!x.hasta||d<=x.hasta))||(p.pausas||[]).find(x=>x.desde>d);
const estadoPac=(p,t=today())=>p.fin&&p.fin<t?'alta':enPausa(p,t)?'pausa':'activo';
function tarifaEn(p,d){let r=null;for(const t of (p.tarifas||[]))if(t.desde<=d&&(!r||t.desde>=r.desde))r=t;return r?+r.monto:+(p.tarifa||cfg('tarifa'))}
function build(p,key,fo,ho,ov,extra){
  const mv=!extra&&ov&&ov.movedTo;const fecha=mv?mv.fecha:fo,hora=mv?mv.hora:ho;
  const modalidad=(ov&&ov.modalidad)||p.modalidad||'presencial';
  const start=dt(fecha,hora),end=new Date(start.getTime()+50*60000);
  const explicit=ov&&ov.estado;
  const estado=explicit||(end<new Date()?'asistio':'programada');
  return {key,pid:p.id,p,fecha,hora,fechaOrig:fo,horaOrig:ho,modalidad,estado,implicit:!explicit,extra:!!extra,movida:!!mv,start};
}
const memo=new Map();
function occurrences(from,to){
  const mk=from+'|'+to;if(memo.has(mk))return memo.get(mk);
  const out=[];const f0=addD(from,-40),t0=addD(to,40);
  for(const p of Object.values(S.pac)){
    if(!p.horarios||!p.horarios.length)continue;
    let d=p.inicio&&p.inicio>f0?p.inicio:f0;
    const end=p.fin&&p.fin<t0?p.fin:t0;
    for(;d<=end;d=addD(d,1)){
      if(p.pausas&&enPausa(p,d))continue;
      const h=scheduleAt(p,d);if(!h)continue;const w=dow(d);
      for(const sl of h.slots||[])if(+sl.dia===w){
        const key=`${p.id}__${d}__${sl.hora.replace(':','')}`;
        out.push(build(p,key,d,sl.hora,S.ses[key],false));
      }
    }
  }
  for(const o of Object.values(S.ses))if(o.extra&&S.pac[o.pid])out.push(build(S.pac[o.pid],o.id,o.fecha,o.hora,o,true));
  const r=out.filter(o=>o.fecha>=from&&o.fecha<=to).sort((a,b)=>a.start-b.start);
  memo.set(mk,r);return r;
}
function allOcc(){
  let min=today();for(const p of Object.values(S.pac))if(p.inicio&&p.inicio<min)min=p.inicio;
  for(const o of Object.values(S.ses))if(o.extra&&o.fecha<min)min=o.fecha;
  return occurrences(min,addD(today(),120));
}
function findOcc(key){return allOcc().find(o=>o.key===key)||occurrences(addD(today(),-400),addD(today(),400)).find(o=>o.key===key)}
const firstMemo=new Map();
function firstKey(pid){if(firstMemo.has(pid))return firstMemo.get(pid);const o=allOcc().find(o=>o.pid===pid&&(COBRA.has(o.estado)||o.estado==='programada'));const k=o?o.key:null;firstMemo.set(pid,k);return k}
const esPrimeraGratis=o=>!!(o.p.primeraGratis&&firstKey(o.pid)===o.key);
const costo=o=>esPrimeraGratis(o)?0:tarifaEn(o.p,o.fecha);
function devengado(pid,from,to){return allOcc().filter(o=>o.pid===pid&&COBRA.has(o.estado)&&(!from||o.fecha>=from)&&(!to||o.fecha<=to)).reduce((s,o)=>s+costo(o),0)}
function pagado(pid){return Object.values(S.pag).filter(x=>x.pid===pid).reduce((s,x)=>s+(+x.monto||0),0)}
function saldo(pid){return devengado(pid)-pagado(pid)}
const pagoDeSesion=key=>Object.values(S.pag).find(x=>x.sesKey===key);

/* reglas de agenda */
function activeOn(fecha,exceptKey){return occurrences(fecha,fecha).filter(o=>ACT.has(o.estado)&&o.key!==exceptKey)}
function maxRun(mins){const s=[...new Set(mins)].sort((a,b)=>a-b);let best=0,run=0,prev=null;for(const m of s){run=(prev!==null&&m-prev===60)?run+1:1;best=Math.max(best,run);prev=m}return best}
async function checkSlot(fecha,hora,exceptKey){
  const others=activeOn(fecha,exceptKey);const m=toMin(hora);
  const clash=others.find(o=>Math.abs(toMin(o.hora)-m)<50);
  if(clash){const ok=await ask('Horario ocupado',`A esa hora ya tienes a <b>${esc(clash.p.nombre)}</b> (${fmtH(clash.hora)}). ¿Agendar de todos modos?`,[{t:'Volver',v:false,cls:'primary'},{t:'Agendar igual',v:true}]);if(!ok)return false}
  const run=maxRun([...others.map(o=>toMin(o.hora)),m]);
  if(run>3){const ok=await ask(`${run} sesiones seguidas`,`Ese día quedarías con <b>${run} sesiones seguidas</b>. Prefieres no agendar más de 3 seguidas.`,[{t:'Elegir otro horario',v:false,cls:'primary'},{t:'Agendar de todos modos',v:true}]);if(!ok)return false}
  return true;
}
async function checkWeekly(pid,slots,desde){
  for(const sl of slots){
    const m=toMin(sl.hora);const same=[];
    for(const p of Object.values(S.pac)){if(p.id===pid||(p.fin&&p.fin<desde))continue;const h=scheduleAt(p,desde)||scheduleAt(p,'9999-12-31');for(const x of (h&&h.slots)||[])if(+x.dia===+sl.dia)same.push({p,m:toMin(x.hora),hora:x.hora})}
    const mine=slots.filter(x=>+x.dia===+sl.dia).map(x=>toMin(x.hora));
    const clash=same.find(x=>Math.abs(x.m-m)<50);
    if(clash){const ok=await ask('Horario ocupado',`Los ${DIAS[sl.dia].toLowerCase()} a las ${fmtH(clash.hora)} ya está <b>${esc(clash.p.nombre)}</b>. ¿Guardar de todos modos?`,[{t:'Revisar',v:false,cls:'primary'},{t:'Guardar igual',v:true}]);if(!ok)return false}
    const run=maxRun([...same.map(x=>x.m),...mine]);
    if(run>3){const ok=await ask(`${run} sesiones seguidas`,`Los ${DIAS[sl.dia].toLowerCase()} quedarías con <b>${run} sesiones seguidas</b>. Prefieres no agendar más de 3 seguidas.`,[{t:'Revisar',v:false,cls:'primary'},{t:'Guardar de todos modos',v:true}]);if(!ok)return false}
  }
  return true;
}

/* Todo vive en memoria mientras la app está desbloqueada y se guarda cifrado en el teléfono. */
const COLS={pacientes:'pac',sesiones:'ses',pagos:'pag',recibos:'rec',material:'mat'};
const strip=o=>{const c=clone(o);delete c.id;for(const k in c)if(c[k]===undefined||c[k]===null&&k!=='movedTo')delete c[k];return c};
const snapshot=()=>({pac:S.pac,ses:S.ses,pag:S.pag,rec:S.rec,cfg:S.cfg,mat:S.mat});
function applyPath(path,data){
  if(path==='config/app'){S.cfg=data?clone(data):{};return true}
  const i=path.indexOf('/');const t=COLS[path.slice(0,i)];if(!t)return false;const id=path.slice(i+1);
  if(data)S[t][id]=Object.assign(strip(data),{id});else delete S[t][id];return true;
}
async function persistNow(){try{await Vault.saveState(snapshot())}catch(e){dbFail(e);throw e}}
async function setDoc(path,data){if(!Vault.unlocked())throw{code:'locked'};if(!applyPath(path,data))return;changed();await persistNow()}
async function delDoc(path){if(!Vault.unlocked())throw{code:'locked'};applyPath(path,null);changed();await persistNow()}
function newId(){return Vault.newId()}
function dbFail(e){toast(e&&e.name==='QuotaExceededError'?'El teléfono no tiene espacio suficiente para guardar.':e&&e.message==='locked'?'La app se bloqueó. Vuelve a entrar.':'No se pudo guardar. Inténtalo otra vez.')}
async function saveOv(o,patch){
  const base=clone(S.ses[o.key])||{};
  const d=Object.assign(base,{pid:o.pid,fechaOrig:o.fechaOrig,horaOrig:o.horaOrig},patch);
  if(o.extra){d.extra=true;d.fecha=d.fecha||o.fecha;d.hora=d.hora||o.hora}
  if(d.estado==null)delete d.estado;if(d.movedTo==null)delete d.movedTo;if(d.modalidad==null)delete d.modalidad;
  await setDoc('sesiones/'+o.key,d);
}
function changed(){memo.clear();firstMemo.clear();S.ready=true;render()}
function loadInto(st){st=st||{};for(const k of['pac','ses','pag','rec','mat']){S[k]={};for(const[id,v]of Object.entries(st[k]||{}))S[k][id]=Object.assign({},v,{id})}S.cfg=st.cfg||{};memo.clear();firstMemo.clear();S.ready=true}

const blobURLs=new Map();
async function fileURL(id){if(blobURLs.has(id))return blobURLs.get(id);const b=await Vault.getFile(id);if(!b)return'';const u=URL.createObjectURL(b);blobURLs.set(id,u);return u}
function hydrate(root){if(!root)return;root.querySelectorAll('[data-blob]').forEach(async el=>{try{const u=await fileURL(el.dataset.blob);if(u)el.src=u}catch(_){}});root.querySelectorAll('[data-bgblob]').forEach(async el=>{try{const u=await fileURL(el.dataset.bgblob);if(u)el.style.backgroundImage=`url('${u}')`}catch(_){}})}
function dropFile(id){if(!id)return;if(blobURLs.has(id)){URL.revokeObjectURL(blobURLs.get(id));blobURLs.delete(id)}Vault.delFile(id).catch(()=>{})}
const safeName=s=>String(s||'archivo').replace(/[\\/:*?"<>|]/g,'').trim()||'archivo';
/* Guarda o comparte un archivo fuera de la app (sale sin cifrar: se avisa antes donde corresponde). */
async function saveFile(blob,name,opts={}){
  name=safeName(name);const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
  if(opts.share&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share(Object.assign({files:[f]},opts.text?{text:opts.text}:{}));return true}catch(e){if(e&&e.name==='AbortError')return false}
  }
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
  toast('Guardado en Descargas: '+name);return true;
}

function vMenu(){

  return `<div class="top" style="padding-bottom:0"><div class="grow"></div><button class="icon-btn" data-act="go" data-to="config" aria-label="Configuración">${ICON.gear}</button></div>

/* ============ Calendario ============ */
function vCal(){
  const c=ui.cal;const isW=c.mode==='semana';
  let label;
  if(isW){const m=mondayOf(c.date),e=addD(m,6);const a=parseD(m),b=parseD(e);label=a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}`:`${a.getDate()} ${MESES[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}`}
  else{const d=parseD(c.date);label=`${D3[dow(c.date)]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`}
  return topbar('Calendario','menu',`<button class="btn ghost sm" data-act="calToday">Hoy</button>`)+
  `<div class="calbar"><div class="seg" style="width:150px;flex:none"><button class="${isW?'on':''}" data-act="calMode" data-m="semana">Semana</button><button class="${!isW?'on':''}" data-act="calMode" data-m="dia">Día</button></div><button class="icon-btn" style="width:36px;height:36px" data-act="calNav" data-n="-1">${ICON.back}</button><div class="lbl" style="text-align:center;font-size:15px">${esc(label)}</div><button class="icon-btn" style="width:36px;height:36px" data-act="calNav" data-n="1">${ICON.next}</button></div>
  ${isW?vWeek():vDay()}
  <button class="fab" data-act="addSes" aria-label="Agregar sesión">${ICON.plus}</button>`;
}
A.calMode=t=>{ui.cal.mode=t.dataset.m;render()};
A.calToday=()=>{ui.cal.date=today();render()};
A.calNav=t=>{ui.cal.date=addD(ui.cal.date,(ui.cal.mode==='semana'?7:1)*+t.dataset.n);render()};
A.dayView=t=>{ui.cal.date=t.dataset.d;ui.cal.mode='dia';render();window.scrollTo(0,0)};
function hourRange(occ){let H0=+cfg('hIni'),H1=+cfg('hFin');for(const o of occ){const m=toMin(o.hora);H0=Math.min(H0,Math.floor(m/60));H1=Math.max(H1,Math.ceil((m+50)/60))}return[H0,H1]}
function vWeek(){
  const mon=mondayOf(ui.cal.date);const days=[...Array(7)].map((_,i)=>addD(mon,i));
  const occ=occurrences(days[0],days[6]);const[H0,H1]=hourRange(occ);const RH=Math.max(30,Math.min(54,Math.floor(((window.innerHeight||800)-195)/(H1-H0))));const t=today();
  const H=(H1-H0)*RH;
  const lines=`background:repeating-linear-gradient(180deg,transparent 0 ${RH-1}px,var(--line) ${RH-1}px ${RH}px)`;
  return `<div class="week"><div class="wk-head"><div></div>${days.map(d=>`<div class="${d===t?'today':''}" data-act="dayView" data-d="${d}">${D3[dow(d)]}<b>${parseD(d).getDate()}</b></div>`).join('')}</div>
  <div class="wk-body"><div class="tcol" style="height:${H}px">${[...Array(H1-H0)].map((_,i)=>`<div style="height:${RH}px">${fmtHh(H0+i)}</div>`).join('')}</div>
  ${days.map(d=>`<div class="dcol" data-act="emptyTap" data-d="${d}" data-h0="${H0}" data-rh="${RH}" style="height:${H}px;${lines}">${occ.filter(o=>o.fecha===d).map(o=>{const top=(toMin(o.hora)-H0*60)/60*RH;return `<div class="blk ${o.modalidad} st-${o.estado}" data-act="openSes" data-k="${esc(o.key)}" style="top:${top+1}px;height:${50/60*RH-2}px"><b>${esc(first(o.p.nombre))}</b><span style="white-space:nowrap">${fmtHc(o.hora)}</span></div>`}).join('')}</div>`).join('')}
  </div></div>
  <div class="wrap row small muted" style="margin-top:10px;gap:14px"><span class="row" style="gap:5px"><span class="dot pres"></span>Presencial</span><span class="row" style="gap:5px"><span class="dot vir"></span>Virtual</span><span>Toca un día para verlo completo</span></div>`;
}
A.emptyTap=(t,e)=>{if(e.target.closest('.blk'))return;const r=t.getBoundingClientRect();const y=e.clientY-r.top;const h=+t.dataset.h0+Math.floor(y/+t.dataset.rh);openAdd(t.dataset.d,`${pad(h)}:00`)};
function vDay(){
  const d=ui.cal.date;const occ=occurrences(d,d);const[H0,H1]=hourRange(occ);
  const rows=[];const used=new Set();
  for(let h=H0;h<H1;h++){
    const here=occ.filter(o=>Math.floor(toMin(o.hora)/60)===h);
    here.forEach(o=>used.add(o.key));
    rows.push(`<div class="slot"><div class="h">${fmtHh(h)}</div><div class="grow">${here.length?here.map(o=>`<div class="scard ${o.modalidad} st-${o.estado}" data-act="openSes" data-k="${esc(o.key)}"><div class="row between"><span class="nm">${esc(o.p.nombre)}</span><b class="small">${fmtH(o.hora)}</b></div><div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">${modChip(o.modalidad)}${o.implicit&&o.estado==='programada'?'':estChip(o)}${o.movida?'<span class="chip gray">Reprogramada</span>':''}${o.extra?'<span class="chip gray">Extra</span>':''}${esPrimeraGratis(o)?'<span class="chip ok">1.ª sesión · sin costo</span>':''}</div></div>`).join(''):`<div class="free" data-act="addAt" data-d="${d}" data-h="${pad(h)}:00">Libre · toca para agendar</div>`}</div></div>`);
  }
  return `<div class="wrap day-list">${occ.length?'':`<div style="margin-bottom:10px">${illo('Calendario abierto con un reloj suave: día libre',90)}</div>`}${rows.join('')}</div>`;
}
A.addAt=t=>openAdd(t.dataset.d,t.dataset.h);
A.addSes=()=>openAdd(ui.cal.mode==='dia'?ui.cal.date:today(),'');

/* --- hoja de sesión --- */
A.openSes=t=>openSession(t.dataset.k);
function openSession(key,panel){
  const o=findOcc(key);if(!o){toast('No encontré esa sesión.');return}
  const p=o.p;const hrs=(o.start-new Date())/36e5;const ov=S.ses[key];
  const pg=pagoDeSesion(key);
  const other=o.modalidad==='virtual'?'presencial':'virtual';
  let body='';
  if(!panel){
    body=`<div class="stack">
      <div class="actgrid">
        <button class="actbtn ${o.estado==='asistio'?'sel':''}" data-act="sesSet" data-k="${esc(key)}" data-e="asistio">✓ Asistió${o.implicit&&o.estado==='asistio'?'<small>marcado por defecto</small>':''}</button>
        <button class="actbtn ${o.estado==='no_asistio'?'sel':''}" data-act="sesSet" data-k="${esc(key)}" data-e="no_asistio">No asistió<small>se cobra</small></button>
        <button class="actbtn ${o.estado.startsWith('cancelo')?'sel':''}" data-act="sesPanel" data-k="${esc(key)}" data-p="cancel">Canceló</button>
        <button class="actbtn" data-act="sesPanel" data-k="${esc(key)}" data-p="move">Reprogramar</button>
      </div>
      <button class="btn ghost" data-act="sesMod" data-k="${esc(key)}">Cambiar a ${other} <span class="muted small">(solo esta sesión)</span></button>
      ${COBRA.has(o.estado)&&p.pago==='sesion'&&costo(o)>0?(pg?`<div class="alert ok">Sesión pagada · ${money(pg.monto)} (${fmtShort(pg.fecha)})</div>`:`<button class="btn soft" data-act="sesPay" data-k="${esc(key)}">Registrar pago de esta sesión · ${money(costo(o))}</button>`):''}
      <div class="row" style="gap:16px;justify-content:center;margin-top:6px;flex-wrap:wrap">
        <button class="link" data-act="openPac" data-id="${esc(p.id)}">Ver ficha</button>
        ${o.extra?`<button class="link" style="color:var(--bad)" data-act="sesDelExtra" data-k="${esc(key)}">Eliminar sesión</button>`:(ov?`<button class="link" style="color:var(--ink2)" data-act="sesReset" data-k="${esc(key)}">Deshacer cambios</button>`:'')}
      </div></div>`;
  }else if(panel==='cancel'){
    const late=hrs<48;
    body=`<div class="stack"><h3>Cancelación</h3>
      ${late?`<div class="alert bad"><b>Esta sesión debe ser pagada porque ya estamos dentro de las 48 horas previas a la sesión.</b></div>
        <button class="btn primary" data-act="sesSet" data-k="${esc(key)}" data-e="cancelo_tarde">Cancelar y cobrar</button>
        <button class="btn ghost" data-act="sesSet" data-k="${esc(key)}" data-e="cancelo">Cancelar sin cobrar (excepción)</button>`
      :`<div class="alert ok">Avisó con más de 48 horas de anticipación (faltan ${Math.floor(hrs/24)} días). No se cobra.</div>
        <button class="btn primary" data-act="sesSet" data-k="${esc(key)}" data-e="cancelo">Confirmar cancelación</button>`}
      <button class="btn ghost" data-act="openSesK" data-k="${esc(key)}">Volver</button></div>`;
  }else if(panel==='move'){
    body=`<div class="stack"><h3>Reprogramar</h3>
      <div><label class="f">Nueva fecha</label><input class="in" type="date" id="mvF" value="${o.fecha}"></div><div><label class="f">Hora</label>${tp('id="mvH"',o.hora)}</div>
      ${o.extra?'':`<label class="radio"><input type="radio" name="mvS" value="solo" checked><div><b>Solo esta sesión</b><div class="muted small">El resto de semanas sigue igual.</div></div></label>
      <label class="radio"><input type="radio" name="mvS" value="todo"><div><b>Cambiar su horario de ahora en adelante</b><div class="muted small">Desde esta semana, todas sus sesiones pasan al nuevo día y hora.</div></div></label>`}
      ${hrs<48?`<div class="alert warn">Faltan menos de 48 horas para esta sesión.</div>`:''}
      <button class="btn primary" data-act="sesMove" data-k="${esc(key)}">Continuar</button>
      <button class="btn ghost" data-act="openSesK" data-k="${esc(key)}">Volver</button></div>`;
  }
  sheet(`<div class="row between" style="align-items:flex-start"><div><h2>${esc(p.nombre)}</h2><div class="muted" style="margin-top:2px">${esc(fmtLong(o.fecha))} · ${fmtH(o.hora)} – ${fmtH(fromMin(toMin(o.hora)+50))}</div></div><button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">${ICON.x}</button></div>
  <div class="row" style="gap:6px;margin:12px 0 16px;flex-wrap:wrap">${modChip(o.modalidad)}${estChip(o)}${o.movida?`<span class="chip gray">Movida desde ${esc(fmtShort(o.fechaOrig))} ${fmtH(o.horaOrig)}</span>`:''}${o.extra?'<span class="chip gray">Sesión extra</span>':''}${esPrimeraGratis(o)?'<span class="chip ok">Primera sesión · sin costo</span>':''}</div>${body}`);
}
A.openSesK=t=>openSession(t.dataset.k);
A.sesPanel=t=>openSession(t.dataset.k,t.dataset.p);
A.sesSet=async t=>{const o=findOcc(t.dataset.k);const e=t.dataset.e;try{await saveOv(o,{estado:e});closeSheet();toast({asistio:'Marcada: asistió',no_asistio:'Marcada: no asistió (se cobra)',cancelo:'Cancelada sin cobro',cancelo_tarde:'Cancelada · se cobra'}[e])}catch(_){}};
A.sesMod=async t=>{const o=findOcc(t.dataset.k);const nv=o.modalidad==='virtual'?'presencial':'virtual';try{await saveOv(o,{modalidad:nv===(o.p.modalidad||'presencial')?null:nv});closeSheet();toast('Esta sesión ahora es '+nv)}catch(_){}};
A.sesReset=async t=>{try{await delDoc('sesiones/'+t.dataset.k);closeSheet();toast('Sesión restablecida')}catch(_){}};
A.sesDelExtra=async t=>{const ok=await ask('Eliminar sesión','¿Eliminar esta sesión extra?',[{t:'Eliminar',v:true,cls:'danger'},{t:'Volver',v:false}]);if(!ok)return;try{await delDoc('sesiones/'+t.dataset.k);closeSheet();toast('Sesión eliminada')}catch(_){}};
A.sesPay=async t=>{const o=findOcc(t.dataset.k);const id=newId('pagos');try{await setDoc('pagos/'+id,{pid:o.pid,monto:costo(o),fecha:today(),sesKey:o.key,nota:'Sesión del '+fmtShort(o.fecha)});closeSheet();toast('Pago registrado')}catch(_){}};
A.sesMove=async t=>{
  const o=findOcc(t.dataset.k);const f=$('#mvF').value,h=tpVal($('#mvH'));
  if(!f||!h){toast('Elige fecha y hora');return}
  const scope=(document.querySelector('input[name=mvS]:checked')||{}).value||'solo';
  const hrs=(o.start-new Date())/36e5;
  if(scope==='todo'){
    if(!await checkWeekly(o.pid,[{dia:dow(f),hora:h}],f))return;
    const p=clone(o.p);const cur=scheduleAt(p,o.fechaOrig);
    const slots=(cur?cur.slots:[]).filter(s=>!(+s.dia===dow(o.fechaOrig)&&s.hora===o.horaOrig));slots.push({dia:dow(f),hora:h});
    const desde=mondayOf(f<o.fechaOrig?f:o.fechaOrig);
    p.horarios=(p.horarios||[]).filter(x=>x.desde<desde);p.horarios.push({desde,slots});
    try{await setDoc('pacientes/'+p.id,p);closeSheet();toast(`Nuevo horario: ${DIAS[dow(f)].toLowerCase()} ${fmtH(h)}`)}catch(_){}
    return;
  }
  if(!await checkSlot(f,h,o.key))return;
  const doMove=async charge=>{
    try{
      if(o.extra){await saveOv(o,{fecha:f,hora:h,fechaOrig:f,horaOrig:h,estado:null})}
      else if(charge){await saveOv(o,{estado:'cancelo_tarde',movedTo:null});const id='x'+newId('sesiones');await setDoc('sesiones/'+id,{extra:true,pid:o.pid,fecha:f,hora:h,fechaOrig:f,horaOrig:h,modalidad:o.modalidad!==(o.p.modalidad||'presencial')?o.modalidad:undefined})}
      else{await saveOv(o,{movedTo:{fecha:f,hora:h},estado:null})}
      closeSheet();toast(`Reprogramada para ${fmtShort(f)} ${fmtH(h)}`);
    }catch(_){}
  };
  if(hrs<48&&!o.extra){
    const r=await ask('Aviso con menos de 48 horas','<b>Esta sesión debe ser pagada porque ya estamos dentro de las 48 horas previas a la sesión.</b><br><br>¿Cómo la registro?',[{t:'Cobrar esta sesión y agendar la nueva aparte',v:'c',cls:'primary'},{t:'Mover sin cobrar (excepción)',v:'m'},{t:'Volver',v:null}]);
    if(!r)return;await doMove(r==='c');
  }else await doMove(false);
};

/* --- agregar sesión --- */
function openAdd(fecha,hora){
  const ps=Object.values(S.pac).filter(p=>!p.fin||p.fin>=today()).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!ps.length){sheet(`<h2>Agregar sesión</h2><p class="muted">Primero agrega un paciente.</p><button class="btn primary" data-act="newPac">Nuevo paciente</button>`);return}
  sheet(`<div class="row between"><h2>Agregar sesión</h2><button class="icon-btn" data-act="closeSheet">${ICON.x}</button></div>
  <div class="stack" style="margin-top:14px">
    <div><label class="f">Paciente</label><select class="in" id="adP">${ps.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}</select></div>
    <div><label class="f">Fecha</label><input class="in" type="date" id="adF" value="${fecha}"></div><div><label class="f">Hora</label>${tp('id="adH"',hora||'09:00')}</div>
    <label class="radio"><input type="radio" name="adS" value="solo" checked><div><b>Solo esta vez</b><div class="muted small">Una sesión adicional.</div></div></label>
    <label class="radio"><input type="radio" name="adS" value="semanal"><div><b>Agregar a su horario semanal</b><div class="muted small">Se repite cada semana desde esa fecha.</div></div></label>
    <button class="btn primary" data-act="addSave">Agregar</button></div>`);
}
A.addSave=async()=>{
  const pid=$('#adP').value,f=$('#adF').value,h=tpVal($('#adH'));if(!f||!h){toast('Elige fecha y hora');return}
  const scope=document.querySelector('input[name=adS]:checked').value;const p=clone(S.pac[pid]);
  if(scope==='semanal'){
    if(!await checkWeekly(pid,[{dia:dow(f),hora:h}],f))return;
    const cur=scheduleAt(p,f)||scheduleAt(p,'9999-12-31');const slots=(cur?clone(cur.slots):[]);slots.push({dia:dow(f),hora:h});
    p.horarios=(p.horarios||[]).filter(x=>x.desde<f);p.horarios.push({desde:f,slots});if(!p.inicio||p.inicio>f)p.inicio=f;
    try{await setDoc('pacientes/'+pid,p);closeSheet();toast('Horario semanal actualizado')}catch(_){}
  }else{
    if(!await checkSlot(f,h,null))return;
    const id='x'+newId('sesiones');
    try{await setDoc('sesiones/'+id,{extra:true,pid,fecha:f,hora:h,fechaOrig:f,horaOrig:h});closeSheet();toast('Sesión agregada')}catch(_){}
  }
};

/* ============ Pacientes ============ */
function vPacientes(){
  const t=today();const ps=Object.values(S.pac).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const act=ps.filter(p=>estadoPac(p,t)==='activo'),pausa=ps.filter(p=>estadoPac(p,t)==='pausa'),alta=ps.filter(p=>estadoPac(p,t)==='alta');
  const item=p=>{const h=scheduleAt(p,t)||scheduleAt(p,'9999-12-31');const sl=(h&&h.slots||[]).slice().sort((a,b)=>a.dia-b.dia||a.hora.localeCompare(b.hora));const sd=saldo(p.id);
    return `<div class="card pitem" data-act="openPac" data-id="${esc(p.id)}" data-name="${esc(p.nombre.toLowerCase())}"><div class="avatar ${p.modalidad==='virtual'?'v':''}">${esc(initials(p.nombre))}</div><div class="grow"><div class="nm">${esc(p.nombre)}</div><div class="muted small">${estadoPac(p,t)==='pausa'?(()=>{const z=pausaActual(p,t);return `En pausa desde ${fmtShort(z.desde)}${z.hasta?` · retoma el ${fmtShort(addD(z.hasta,1))}`:''}`})():estadoPac(p,t)==='alta'?`De alta desde ${fmtShort(p.fin)}`:sl.length?sl.map(s=>`${D3[s.dia]} ${fmtH(s.hora)}`).join(' · '):'Sin horario fijo'}</div></div>${sd>0.009?`<div class="amount due small">${money(sd)}</div>`:''}<div class="pchips"><button data-act="openGen" data-id="${esc(p.id)}">Datos generales</button><button class="cl" data-act="openClin" data-id="${esc(p.id)}">Datos clínicos</button></div></div>`};
  return topbar('Pacientes')+`<div class="wrap stack">
    <div class="search">${ICON.search}<input class="in" id="q" placeholder="Buscar paciente" value="${esc(ui.q)}"></div>
    <button class="btn primary" data-act="newPac">${ICON.plus.replace('<svg','<svg width="18"')} Nuevo paciente</button>
    ${act.length?act.map(item).join(''):illo('Persona con libreta, sentada: aún no hay pacientes',140)}
    ${pausa.length?`<div class="sec-title">En pausa</div>${pausa.map(item).join('')}`:''}
    ${alta.length?`<div class="sec-title">De alta</div>${alta.map(item).join('')}`:''}
  </div>`;
}
function bindSearch(){const i=$('#q');if(!i)return;const f=()=>{ui.q=i.value;const v=i.value.trim().toLowerCase();document.querySelectorAll('.pitem').forEach(el=>{el.style.display=el.dataset.name.includes(v)?'':'none'})};i.addEventListener('input',f);f()}
A.newPac=()=>openPatient(null);
A.openPac=t=>openPatient(t.dataset.id);

function openPatient(id){
  const isNew=!id;const t=today();
  const p=isNew?{nombre:'',telefono:'',dni:'',ruc:'',emNombre:'',emTel:'',notas:'',modalidad:'presencial',pago:'mensual',inicio:t,horarios:[],tarifas:[{desde:'2000-01-01',monto:cfg('tarifa')}]}:clone(S.pac[id]);
  if(!p){toast('Paciente no encontrado');return}

  const sd=isNew?0:saldo(id);const mk=mesKey(t);

  <form class="stack" id="pf" style="margin-top:16px" autocomplete="off">
    <div><label class="f">Nombre de pila *</label><input class="in" name="nombre" value="${esc(p.nombre)}" placeholder="Solo el nombre, sin apellidos" required></div>
    <div class="grid2"><div><label class="f">Teléfono</label><input class="in" name="telefono" inputmode="tel" value="${esc(p.telefono)}"></div><div><label class="f">DNI</label><input class="in" name="dni" inputmode="numeric" value="${esc(p.dni)}"></div></div>
    <div><label class="f">RUC</label><input class="in" name="ruc" inputmode="numeric" value="${esc(p.ruc)}"></div>
    <div class="grid2"><div><label class="f">Contacto de emergencia</label><input class="in" name="emNombre" placeholder="Nombre" value="${esc(p.emNombre)}"></div><div><label class="f">Teléfono emergencia</label><input class="in" name="emTel" inputmode="tel" value="${esc(p.emTel)}"></div></div>

    <label class="radio"><input type="checkbox" name="primeraGratis" ${p.primeraGratis?'checked':''}><div><b>Primera sesión</b><div class="muted small">Su primera sesión no se cobra. La tarifa de arriba aplica desde la segunda.</div></div></label>
    <div id="tarDesde" style="display:none"><label class="f">La nueva tarifa aplica desde</label><input class="in" name="tarDesde" type="date" value="${t.slice(0,8)}01"></div>

    <div><label class="f">Forma de pago</label>${seg('pago',p.pago||'mensual',[['sesion','Por sesión'],['quincenal','Quincenal'],['mensual','Mensual']])}</div>
    <div><label class="f">Horario semanal</label><div id="slots"></div><button type="button" class="btn ghost sm" data-addslot>${ICON.plus.replace('<svg','<svg width="16"')} Agregar día</button></div>
    <div id="hDesde" style="display:none"><label class="f">El nuevo horario aplica desde</label><input class="in" name="hDesde" type="date" value="${t}"><div class="muted small" style="margin-top:4px">Las semanas anteriores no cambian.</div></div>
    <div><label class="f">Notas (máx. 100 palabras)</label><textarea class="in" name="notas" rows="4">${esc(p.notas)}</textarea><div class="counter" id="cnt"></div></div>
    <button class="btn primary" type="submit" id="pfSave">${isNew?'Guardar paciente':'Guardar cambios'}</button>
    ${isNew?'':`${recs.length?`<div class="sec-title">Recibos</div><div class="card">${recs.map(r=>`<div class="lrow"><div class="grow"><b style="text-transform:capitalize">${esc(mesLabel(r.mes))}</b><div class="muted small">${money(r.monto)} · ${r.enviado?'Enviado':'Por enviar'}</div></div><button type="button" class="btn ghost sm" data-act="recDl" data-id="${esc(r.id)}">Descargar</button></div>`).join('')}</div>`:''}
    ${p.fin&&p.fin<t?'':(()=>{const z=pausaActual(p,t);return z?`<div class="alert warn">${z.desde<=t?'En pausa desde':'Pausa programada desde'} <b>${esc(fmtLong(z.desde))}</b>${z.hasta?`, retoma el <b>${esc(fmtLong(addD(z.hasta,1)))}</b>`:''}. Mientras tanto no aparecen sus sesiones.</div><button type="button" class="btn primary" data-act="pausaFin" data-id="${esc(id)}">Retomar tratamiento</button>`:`<button type="button" class="btn ghost" data-act="pausaIni" data-id="${esc(id)}">Pausar tratamiento</button>`})()}
    ${p.fin&&p.fin<t?`<button type="button" class="btn ghost" data-act="pacReactivar" data-id="${esc(id)}">Reactivar paciente</button>`:`<button type="button" class="btn ghost" data-act="pacAlta" data-id="${esc(id)}">Dar de alta (terminar tratamiento)</button>`}
    <button type="button" class="btn danger" data-act="pacDel" data-id="${esc(id)}">Eliminar paciente</button>`}
  </form>`);
  const form=$('#pf',sh);
  const drawSlots=()=>{$('#slots',sh).innerHTML=F.slots.map((s,i)=>`<div class="slotrow"><select class="in" data-sd="${i}">${[1,2,3,4,5,6,7].map(d=>`<option value="${d}" ${+s.dia===d?'selected':''}>${DIAS[d]}</option>`).join('')}</select>${tp(`data-tpi="${i}"`,s.hora)}<button type="button" class="icon-btn" style="width:48px;height:48px;border-radius:12px" data-rm="${i}" aria-label="Quitar">${ICON.x}</button></div>`).join('')||'<div class="muted small" style="margin-bottom:8px">Sin horario fijo todavía.</div>';chk()};
  const chk=()=>{const now=JSON.stringify(F.slots.filter(s=>s.hora).map(s=>[+s.dia,s.hora]).sort());$('#hDesde',sh).style.display=(!isNew&&now!==F.orig)?'':'none';
    $('#tarDesde',sh).style.display=(!isNew&&+form.tarifa.value!==+F.tar)?'':'none';
    const w=words(form.notas.value);const c=$('#cnt',sh);c.textContent=`${w}/100 palabras`;c.classList.toggle('over',w>100);$('#pfSave',sh).disabled=w>100};
  sh.addEventListener('click',e=>{const sb=e.target.closest('[data-seg] button');if(sb){sb.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sb))}
    if(e.target.closest('[data-addslot]')){F.slots.push({dia:F.slots.length?F.slots[F.slots.length-1].dia%7+1:1,hora:'09:00'});drawSlots()}
    const rm=e.target.closest('[data-rm]');if(rm){F.slots.splice(+rm.dataset.rm,1);drawSlots()}});
  sh.addEventListener('change',e=>{if(e.target.dataset.sd!=null)F.slots[+e.target.dataset.sd].dia=+e.target.value;const w=e.target.closest('[data-tpi]');if(w)F.slots[+w.dataset.tpi].hora=tpVal(w);chk()});
  sh.addEventListener('input',chk);

  form.addEventListener('submit',async e=>{
    e.preventDefault();const fd=Object.fromEntries(new FormData(form));
    if(!fd.nombre.trim()){toast('Escribe el nombre');return}

    const segv=n=>sh.querySelector(`[data-seg="${n}"] .on`).dataset.v;
    const slots=F.slots.filter(s=>s.hora).map(s=>({dia:+s.dia,hora:s.hora}));
    const np=Object.assign(p,{nombre:fd.nombre.trim(),telefono:fd.telefono.trim(),dni:fd.dni.trim(),ruc:fd.ruc.trim(),emNombre:fd.emNombre.trim(),emTel:fd.emTel.trim(),notas:fd.notas.trim(),primeraGratis:!!fd.primeraGratis,modalidad:segv('modalidad'),pago:segv('pago'),inicio:fd.inicio||t});
    const changedH=JSON.stringify(slots.map(s=>[s.dia,s.hora]).sort())!==F.orig;
    const desde=isNew?np.inicio:(fd.hDesde||t);
    if((isNew||changedH)&&slots.length&&!await checkWeekly(isNew?'__new':id,slots,desde))return;
    if(isNew){np.horarios=[{desde:'2000-01-01',slots}]}
    else if(changedH){np.horarios=(np.horarios||[]).filter(x=>x.desde<desde);np.horarios.push({desde,slots})}
    if(!np.horarios||!np.horarios.length)np.horarios=[{desde:'2000-01-01',slots}];
    const tar=+fd.tarifa||0;
    if(isNew)np.tarifas=[{desde:'2000-01-01',monto:tar}];
    else if(tar!==+F.tar){const td=fd.tarDesde||t;np.tarifas=(np.tarifas||[]).filter(x=>x.desde<td);np.tarifas.push({desde:td,monto:tar})}
    const pid=isNew?newId('pacientes'):id;np.id=pid;
    try{await setDoc('pacientes/'+pid,np);closeSheet();toast(isNew?'Paciente guardado':'Cambios guardados')}catch(_){}
  });
}
A.pausaIni=t=>{const id=t.dataset.id;const p=S.pac[id];
  sheet(`<div class="row between"><h2>Pausar tratamiento</h2><button class="icon-btn" data-act="closeSheet">${ICON.x}</button></div>
  <p class="muted">${esc(p.nombre)} deja de aparecer en el calendario y en las cuentas mientras dure la pausa. Su ficha, su historial y su saldo se mantienen.</p>
  <div class="stack"><div><label class="f">Desde</label><input class="in" type="date" id="pzD" value="${today()}"></div>
  <div><label class="f">Retoma el (opcional)</label><input class="in" type="date" id="pzH"><div class="muted small" style="margin-top:4px">Si no sabes cuándo vuelve, déjalo vacío.</div></div>
  <button class="btn primary" data-act="pausaSave" data-id="${esc(id)}">Pausar</button><button class="btn ghost" data-act="openPac" data-id="${esc(id)}">Volver</button></div>`)};
A.pausaSave=async t=>{const p=clone(S.pac[t.dataset.id]);const d=$('#pzD').value||today(),r=$('#pzH').value;
  if(r&&r<=d){toast('La fecha de retorno debe ser posterior');return}
  p.pausas=(p.pausas||[]).filter(x=>x.hasta&&x.hasta<d);p.pausas.push(r?{desde:d,hasta:addD(r,-1)}:{desde:d});
  try{await setDoc('pacientes/'+p.id,p);closeSheet();toast('Tratamiento en pausa')}catch(_){}};
A.pausaFin=t=>{const id=t.dataset.id;const p=S.pac[id];
  sheet(`<div class="row between"><h2>Retomar tratamiento</h2><button class="icon-btn" data-act="closeSheet">${ICON.x}</button></div>
  <p class="muted">Desde esa fecha vuelven sus sesiones con su horario de siempre. Si cambió el horario, edítalo luego en su ficha.</p>
  <div class="stack"><div><label class="f">Retoma el</label><input class="in" type="date" id="pzR" value="${today()}"></div>
  <button class="btn primary" data-act="pausaFinSave" data-id="${esc(id)}">Retomar</button><button class="btn ghost" data-act="openPac" data-id="${esc(id)}">Volver</button></div>`)};
A.pausaFinSave=async t=>{const p=clone(S.pac[t.dataset.id]);const r=$('#pzR').value||today();const z=pausaActual(p);
  p.pausas=(p.pausas||[]).filter(x=>x!==z&&!(x.desde===z.desde));if(r>z.desde)p.pausas.push({desde:z.desde,hasta:addD(r,-1)});
  try{await setDoc('pacientes/'+p.id,p);closeSheet();toast('Tratamiento retomado')}catch(_){}};
A.pacAlta=async t=>{const ok=await ask('Dar de alta','Desde mañana ya no aparecerán sus sesiones en el calendario. Su historial y saldo se mantienen.',[{t:'Dar de alta',v:true,cls:'primary'},{t:'Volver',v:false}]);if(!ok)return;const p=clone(S.pac[t.dataset.id]);p.fin=today();try{await setDoc('pacientes/'+p.id,p);closeSheet();toast('Paciente dado de alta')}catch(_){}};
A.pacReactivar=async t=>{const p=clone(S.pac[t.dataset.id]);delete p.fin;try{await setDoc('pacientes/'+p.id,p);closeSheet();toast('Paciente reactivado')}catch(_){}};
A.pacDel=async t=>{const p=S.pac[t.dataset.id];const ok=await ask('Eliminar paciente',`Se borrará a <b>${esc(p.nombre)}</b> con su historial de sesiones y todo su material clínico. Si solo terminó el tratamiento, mejor usa “Dar de alta”.`,[{t:'Eliminar definitivamente',v:true,cls:'danger'},{t:'Volver',v:false,cls:'primary'}]);if(!ok)return;try{await delDoc('pacientes/'+p.id);for(const s of Object.values(S.ses))if(s.pid===p.id)await delDoc('sesiones/'+s.id);for(const m of Object.values(S.mat))if(m.pid===p.id){await delDoc('material/'+m.id);dropFile(m.fileId)}closeSheet();toast('Paciente eliminado')}catch(_){}};

/* --- pagos --- */
A.openPagos=t=>openPagos(t.dataset.id);
function openPagos(pid){
  const p=S.pac[pid];if(!p)return;const sd=saldo(pid);const t=today();
  const pagos=Object.values(S.pag).filter(x=>x.pid===pid).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const meses=[0,-1,-2].map(n=>shiftMes(mesKey(t),n)).map(mk=>{const os=occurrences(mk+'-01',lastDay(mk)).filter(o=>o.pid===pid&&COBRA.has(o.estado));return{mk,n:os.length,m:os.reduce((s,o)=>s+costo(o),0),os}});
  sheet(`<div class="row between"><h2>${esc(p.nombre)}</h2><button class="icon-btn" data-act="closeSheet">${ICON.x}</button></div>
  <div class="card" style="margin-top:14px"><div class="muted small">Saldo pendiente</div><div class="big ${sd>0.009?'amount due':''}">${money(Math.max(sd,0))}</div>${sd<-0.009?`<div class="small" style="color:var(--ok)">Saldo a favor: ${money(-sd)}</div>`:''}<div class="muted small" style="margin-top:4px">Paga ${PAGO[p.pago||'mensual'].toLowerCase()}${sd>0.009&&tarifaEn(p,t)?` · equivale a ${Math.round(sd/tarifaEn(p,t)*10)/10} sesiones`:''}</div></div>
  <div class="sec-title">Registrar pago</div>
  <div class="stack"><div class="grid2"><div><label class="f">Monto (S/)</label><input class="in" id="pgM" type="number" min="0" step="1" value="${sd>0?Math.round(sd*100)/100:tarifaEn(p,t)}"></div><div><label class="f">Fecha</label><input class="in" id="pgF" type="date" value="${t}"></div></div>
  <input class="in" id="pgN" placeholder="Nota (opcional), ej. pago parcial de noviembre">
  <div class="btn ghost filebtn" style="cursor:pointer" id="pgCL"><span>Adjuntar comprobante (foto o captura)</span><input type="file" accept="image/*" id="pgC"></div>
  <button class="btn primary" data-act="pagoSave" data-id="${esc(pid)}">Guardar pago</button></div>
  <div class="sec-title">Sesiones cobrables por mes</div>
  <div class="card">${meses.map(x=>`<div class="lrow"><div class="grow" style="text-transform:capitalize"><b>${esc(mesLabel(x.mk))}</b><div class="muted small" style="text-transform:none">${x.n} ${x.n===1?'sesión':'sesiones'}${x.os.some(o=>o.estado!=='asistio')?` (incluye ${x.os.filter(o=>o.estado!=='asistio').length} falta/cancelación tardía)`:''}</div></div><b>${money(x.m)}</b></div>`).join('')}</div>
  <div class="sec-title">Pagos registrados</div>
  <div class="card">${pagos.length?pagos.map(x=>`<div class="lrow">${x.comprobante?`<img class="thumb" data-blob="${esc(x.comprobante)}" alt="Comprobante" data-act="viewComp" data-id="${esc(x.id)}">`:''}<div class="grow"><b>${money(x.monto)}</b><div class="muted small">${esc(fmtShort(x.fecha))}${x.nota?' · '+esc(x.nota):''}</div>${x.comprobante?'':`<div class="link small filebtn" style="cursor:pointer"><span>+ Adjuntar comprobante</span><input type="file" accept="image/*" data-comp="${esc(x.id)}"></div>`}</div><button class="icon-btn" style="width:34px;height:34px" data-act="pagoDel" data-id="${esc(x.id)}" data-p="${esc(pid)}" aria-label="Borrar">${ICON.x}</button></div>`).join(''):'<div class="muted small">Aún no hay pagos.</div>'}</div>`);
  const ci=$('#pgC');if(ci)ci.addEventListener('change',()=>{const l=$('#pgCL');if(ci.files[0]){l.querySelector('span').textContent='✓ Comprobante listo: '+ci.files[0].name.slice(0,28)}});
}
A.pagoSave=async t=>{const pid=t.dataset.id;const m=+$('#pgM').value;if(!(m>0)){toast('Escribe un monto');return}const id=newId('pagos');
  let comprobante;const f=$('#pgC')&&$('#pgC').files[0];
  if(f){t.disabled=true;toast('Subiendo comprobante…');try{comprobante=(await uploadImage(f,1800)).id}catch(err){t.disabled=false;toast(upErr(err));return}}
  try{await setDoc('pagos/'+id,{pid,monto:m,fecha:$('#pgF').value||today(),nota:$('#pgN').value.trim(),comprobante});toast('Pago registrado');setTimeout(()=>openPagos(pid),120)}catch(_){}};
A.pagoDel=async t=>{const ok=await ask('Borrar pago','¿Borrar este pago registrado?',[{t:'Borrar',v:true,cls:'danger'},{t:'Volver',v:false}]);if(!ok)return;try{await delDoc('pagos/'+t.dataset.id);toast('Pago borrado');setTimeout(()=>openPagos(t.dataset.p),120)}catch(_){}};

/* ============ Cuentas ============ */
function vCuentas(){
  const tab=ui.cuentasTab;
  return topbar('Cuentas')+`<div class="tabs">${[['cobrar','Por cobrar'],['pagar','Por pagar'],['recibos','Recibos']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="ctab" data-t="${k}">${l}</button>`).join('')}</div>`+
  ({cobrar:vCobrar,pagar:vPagar,recibos:vRecibos}[tab])();
}
A.ctab=t=>{ui.cuentasTab=t.dataset.t;render()};
const mesNav=(mk,act)=>`<div class="calbar" style="padding:0 0 12px"><button class="icon-btn" data-act="${act}" data-n="-1">${ICON.back}</button><div class="lbl" style="text-align:center">${esc(mesLabel(mk))}</div><button class="icon-btn" data-act="${act}" data-n="1">${ICON.next}</button></div>`;
A.mesNav=t=>{ui.mes=shiftMes(ui.mes,+t.dataset.n);render()};
function vCobrar(){
  const ps=Object.values(S.pac).map(p=>({p,sd:saldo(p.id)})).sort((a,b)=>b.sd-a.sd);
  const deben=ps.filter(x=>x.sd>0.009);const total=deben.reduce((s,x)=>s+x.sd,0);
  const mk=ui.mes;const occ=occurrences(mk+'-01',lastDay(mk)).filter(o=>COBRA.has(o.estado));
  const mesTotal=occ.reduce((s,o)=>s+costo(o),0);
  return `<div class="wrap stack">
    <div class="card"><div class="muted small">Total pendiente de cobro</div><div class="big">${money(total)}</div><div class="muted small">${deben.length} ${deben.length===1?'paciente':'pacientes'} con saldo</div></div>
    ${deben.length?`<div class="sec-title">Con saldo pendiente</div>${deben.map(({p,sd})=>`<div class="card pitem" data-act="openPagos" data-id="${esc(p.id)}"><div class="avatar ${p.modalidad==='virtual'?'v':''}">${esc(initials(p.nombre))}</div><div class="grow"><div class="nm">${esc(p.nombre)}</div><div class="muted small">${PAGO[p.pago||'mensual']}</div></div><div class="amount due">${money(sd)}</div></div>`).join('')}`:illo('Balanza en equilibrio / alcancía: todo al día',120)}
    <div class="sec-title">Lo generado por mes</div>
    ${mesNav(mk,'mesNav')}
    <div class="card"><div class="row between"><b>Total del mes</b><b>${money(mesTotal)}</b></div><div class="muted small">${occ.length} sesiones cobrables</div>
    ${Object.values(S.pac).map(p=>{const os=occ.filter(o=>o.pid===p.id);if(!os.length)return'';return `<div class="lrow" data-act="openPagos" data-id="${esc(p.id)}" style="cursor:pointer"><div class="grow"><b>${esc(p.nombre)}</b><div class="muted small">${os.length} ${os.length===1?'sesión':'sesiones'}</div></div><span>${money(os.reduce((s,o)=>s+costo(o),0))}</span></div>`}).join('')}</div>
  </div>`;
}
function vPagar(){
  const mk=ui.mes;const occ=occurrences(mk+'-01',lastDay(mk)).filter(o=>o.modalidad==='presencial'&&(o.estado==='asistio'||o.estado==='no_asistio'));
  const realizadas=occ.filter(o=>o.fecha<=today()||!o.implicit);
  const c=+cfg('consultorio');const total=realizadas.length*c;const pagado=!!(S.cfg.consPagado&&S.cfg.consPagado[mk]);
  const prog=occurrences(mk+'-01',lastDay(mk)).filter(o=>o.modalidad==='presencial'&&o.estado==='programada').length;
  const byDay={};realizadas.forEach(o=>{(byDay[o.fecha]=byDay[o.fecha]||[]).push(o)});
  return `<div class="wrap stack">${mesNav(mk,'mesNav')}
    <div class="card"><div class="muted small">Consultorio · ${realizadas.length} ${realizadas.length===1?'hora':'horas'} × ${money(c)}</div><div class="big">${money(total)}</div>
    ${prog?`<div class="muted small">Faltan ${prog} sesiones presenciales programadas este mes (+${money(prog*c)} si se realizan).</div>`:''}
    <div style="margin-top:12px">${pagado?`<div class="row between"><span class="chip ok">Pagado al consultorio</span><button class="link" data-act="consPay" data-v="0">Desmarcar</button></div>`:`<button class="btn soft" data-act="consPay" data-v="1">Marcar como pagado</button>`}</div></div>

async function toJpeg(file,max){
  let src;
  try{src=await createImageBitmap(file)}catch(_){src=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej({code:'decode'});im.src=u})}
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:'encode'}),'image/jpeg',0.86));
}
async function uploadImage(file,max){
  let blob;try{blob=await toJpeg(file,max)}catch(e){if(/^image\/(png|jpeg|webp|gif)$/.test(file.type))blob=file;else throw{code:'decode'}}
  return Vault.putFile(blob,{type:blob.type||'image/jpeg'});
}

  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime}:{});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const t0=Date.now();ui.recording=true;

    if(save&&chunks.length){const type=(rec.mimeType||'audio/webm').split(';')[0];const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';const d=new Date();
      try{await addMat(pid,fecha,new Blob(chunks,{type}),`Reflexión ${fmtShort(fecha)} ${pad(d.getHours())}.${pad(d.getMinutes())}.${ext}`);toast('Grabación guardada y cifrada')}catch(e){dbFail(e)}}

/* lector de .docx / .odt / .txt / .rtf sin librerías */
async function unzipEntry(blob,name){
  const buf=new Uint8Array(await blob.arrayBuffer());const dv=new DataView(buf.buffer);
  let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)return null;
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const td=new TextDecoder();
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const fn=td.decode(buf.subarray(p+46,p+46+nl));
    if(fn===name){const s=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);const data=buf.subarray(s,s+csize);
      if(method===0)return td.decode(data);
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}
    p+=46+nl+xl+cl;
  }
  return null;
}
function xmlText(xml,para,run){
  const d=new DOMParser().parseFromString(xml,'application/xml');const out=[];
  const walk=(n,acc)=>{for(const c of n.childNodes){if(c.nodeType===3){if(run==='*')acc.push(c.nodeValue)}else if(c.nodeType===1){const t=c.nodeName;
    if(t===run)acc.push(c.textContent);else if(t==='w:tab'||t==='text:tab')acc.push('\t');else if(t==='w:br'||t==='w:cr'||t==='text:line-break')acc.push('\n');else if(t==='text:s')acc.push(' ');else walk(c,acc)}}};
  for(const p of d.getElementsByTagName('*'))if(para.includes(p.nodeName)&&!(p.parentNode&&para.includes(p.parentNode.nodeName))){const acc=[];walk(p,acc);out.push(acc.join(''))}
  return out.join('\n');
}
async function docText(blob,name,mime){
  const ext=extOf(name);
  if(ext==='docx'||/wordprocessingml/.test(mime)){const x=await unzipEntry(blob,'word/document.xml');return x==null?null:xmlText(x,['w:p'],'w:t')}
  if(ext==='odt'||/opendocument\.text/.test(mime)){const x=await unzipEntry(blob,'content.xml');return x==null?null:xmlText(x,['text:p','text:h'],'*')}
  if(ext==='txt'||/^text\/plain/.test(mime))return await blob.text();
  if(ext==='rtf'||/rtf/.test(mime)){const r=await blob.text();return r.replace(/\\par[d]?/g,'\n').replace(/\{\\\*[^{}]*\}/g,'').replace(/\\'([0-9a-f]{2})/gi,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,'')}
  return null;
}

  $('#apF',sh).addEventListener('submit',e=>{e.preventDefault();const v=$('#apP',sh).value;if(v)fin(v)});$('#apC',sh).onclick=()=>{closeSheet();fin(null)};

const setProg=(a,b,msg)=>{const bar=$('#pgBar');if(bar)bar.style.width=(b?Math.round(a/b*100):100)+'%';if(msg&&$('#pgMsg'))$('#pgMsg').textContent=msg};

async function restoreFrom(file,{setup}={}){
  const pw=await askPw('Restaurar respaldo','Escribe la contraseña con la que se hizo ese respaldo.','Abrir respaldo');if(!pw)return false;
  progress('Abriendo respaldo…','Descifrando');
  let bk;try{bk=await Vault.readBackup(file,pw)}catch(e){closeSheet();toast(e.message==='badpw'?'Contraseña incorrecta para ese respaldo.':e.message==='notbackup'?'Ese archivo no es un respaldo de esta app.':'No se pudo leer el respaldo.');return false}
  closeSheet();
  if(!setup){const ok=await ask('Reemplazar todo',`Se reemplazará todo lo que hay ahora en la app por el respaldo del <b>${esc(new Date(bk.fecha).toLocaleString('es-PE',{dateStyle:'long',timeStyle:'short'}))}</b>.`,[{t:'Restaurar',v:true,cls:'danger'},{t:'Cancelar',v:false}]);if(!ok)return false}
  else await Vault.create(pw);
  progress('Restaurando…','Guardando archivos cifrados');
  try{await Vault.wipeAll();for(const[i,f]of bk.files.entries()){await Vault.putFileAs(f.id,f.blob,{type:f.type});setProg(i+1,bk.files.length)}
    for(const u of blobURLs.values())URL.revokeObjectURL(u);blobURLs.clear();
    loadInto(bk.state);await persistNow();closeSheet();toast('Respaldo restaurado');return true}
  catch(e){closeSheet();toast('No se pudo terminar de restaurar. Inténtalo otra vez.');return false}
}

function bump(){clearTimeout(idleT);if(Vault.unlocked())idleT=setTimeout(()=>{if(!ui.recording)lockNow()},(+cfg('bloqueo')||5)*60000)}
['click','keydown','touchstart','input','scroll'].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else{if(Vault.unlocked()&&hiddenAt&&!ui.recording&&Date.now()-hiddenAt>(+cfg('bloqueo')||5)*60000)lockNow();else if(Vault.unlocked())checkInbox()}});
function lockNow(){
  Vault.lock();for(const u of blobURLs.values())URL.revokeObjectURL(u);blobURLs.clear();
  for(const k of['pac','ses','pag','rec','mat'])S[k]={};S.cfg={};S.ready=false;memo.clear();firstMemo.clear();
  closeSheet();document.querySelectorAll('.dlg-wrap').forEach(x=>x.remove());lockMode='unlock';render();
}
function vLock(){
  const setup=lockMode==='setup';
  return `<div class="lock"><div class="w-top" style="margin-top:max(7vh,28px)"><div class="mark grad">${ICON.mCal}</div><h1>${setup?'Bienvenido a tu administrador psicoanalítico':'Administrador psicoanalítico'}</h1></div>
  <form class="lock-card stack" id="lkF" autocomplete="off">
  ${setup?`<div class="small" style="color:var(--ink2)">Crea una contraseña para proteger la app. Todo lo que guardes quedará cifrado en este teléfono.</div>
    <div><label class="f">¿Cómo te llamas? (para el saludo)</label><input class="in" id="lkN" autocomplete="given-name"></div>
    <div><label class="f">Contraseña (mínimo 8 caracteres)</label><input class="in" type="password" id="lkP" autocomplete="new-password"></div>
    <div><label class="f">Repítela</label><input class="in" type="password" id="lkP2" autocomplete="new-password"></div>
    <div class="alert warn small"><b>Anótala en un lugar seguro.</b> Si la olvidas no hay forma de recuperar los datos: ni yo ni nadie puede abrirlos.</div>
    <button class="btn primary" id="lkGo">Crear y entrar</button>
    <div class="link small filebtn" style="text-align:center;padding:6px 0"><span>¿Ya tienes un respaldo? Restaurarlo</span><input type="file" data-restore="setup"></div>`
  :`<div><label class="f">Contraseña</label><input class="in" type="password" id="lkP" autocomplete="current-password" autofocus></div>
    <button class="btn primary" id="lkGo">Entrar</button><div class="small" id="lkE" style="color:var(--bad);text-align:center;min-height:18px"></div>`}
  </form></div>`;
}
function bindLock(){
  const f=$('#lkF');if(!f)return;bindFiles(f);
  f.addEventListener('submit',async e=>{e.preventDefault();const b=$('#lkGo');const pw=$('#lkP').value;
    if(lockMode==='setup'){
      if(pw.length<8){toast('La contraseña debe tener al menos 8 caracteres');return}if(pw!==$('#lkP2').value){toast('Las contraseñas no coinciden');return}
      b.disabled=true;b.textContent='Creando…';
      try{await Vault.create(pw);loadInto({cfg:{nombre:$('#lkN').value.trim()}});await persistNow();await afterUnlock();toast('Listo. Tu app está protegida.')}catch(err){b.disabled=false;b.textContent='Crear y entrar';toast('No se pudo crear. Inténtalo otra vez.')}
      return;
    }
    if(!pw)return;b.disabled=true;b.textContent='Abriendo…';
    try{await Vault.unlock(pw);loadInto(await Vault.loadState());await afterUnlock()}
    catch(err){b.disabled=false;b.textContent='Entrar';const el=$('#lkE');if(el)el.textContent=err.message==='badpw'?'Contraseña incorrecta':'No se pudo abrir. Inténtalo otra vez.';$('#lkP').value='';$('#lkP').focus()}
  });
  if(lockMode==='unlock')setTimeout(()=>{const i=$('#lkP');i&&i.focus()},200);
}
async function afterUnlock(){
  Vault.persist();bump();
  if(location.hash!=='#inicio'&&location.hash!=='#menu')location.hash='inicio';
  render();setTimeout(checkInbox,400);
}

/* ============ Arranque ============ */
async function boot(){
  if(location.search){history.replaceState(null,'',location.pathname+'#inicio')}
  if(!window.crypto||!crypto.subtle||!window.indexedDB){$('#app').innerHTML='<div class="wrap" style="padding-top:40px"><div class="alert bad">Este navegador no permite guardar datos cifrados. Abre la app en Chrome.</div></div>';return}
  try{lockMode=await Vault.isSetUp()?'unlock':'setup'}catch(_){lockMode='setup'}
  render();
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
if(location.hash&&location.hash!=='#inicio')location.hash='inicio';
setInterval(()=>{if(!Vault.unlocked())return;memo.clear();if(route()==='calendario'||route()==='menu')render()},5*60*1000);
boot();
</script>
</body>
</html>
